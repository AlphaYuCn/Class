{% extends "base.html" %}
{% block title %}{% if group %}编辑分组{% else %}新建分组{% endif %}{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h2 class="mb-0"><i class="bi bi-people"></i> {% if group %}编辑分组「{{ group.name }}」{% else %}新建分组{% endif %}</h2>
  <a href="{{ url_for('students.group_list') }}" class="btn btn-link"><i class="bi bi-arrow-left"></i> 返回列表</a>
</div>

<div class="card shadow-sm">
  <div class="card-body">
    <form method="post" action="{{ url_for('students.group_new') if not group else url_for('students.group_edit', gid=group.id) }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="row g-3">
        <div class="col-md-4">
          <label class="form-label">组名 <span class="text-danger">*</span></label>
          <input type="text" name="name" value="{{ group.name if group else '' }}" class="form-control" required>
        </div>
        <div class="col-md-4">
          <label class="form-label">分组类型</label>
          <select name="group_type" class="form-select">
            {% for k, v in type_choices.items() %}
              <option value="{{ k }}" {% if group and group.group_type == k %}selected{% endif %}>{{ v }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="col-md-4">
          <label class="form-label">备注</label>
          <input type="text" name="note" value="{{ group.note if group else '' }}" class="form-control">
        </div>
      </div>
      <hr>
      <h6>选择成员</h6>
      <div class="row g-2" style="max-height:400px;overflow-y:auto;">
        {% for s in students %}
          <div class="col-md-4 col-sm-6">
            <div class="form-check">
              <input type="checkbox" name="member_ids" value="{{ s.id }}" id="m{{ s.id }}" class="form-check-input">
              <label for="m{{ s.id }}" class="form-check-label">{{ s.name }} <small class="text-muted">{{ s.student_no }}</small></label>
            </div>
          </div>
        {% endfor %}
      </div>
      <div class="mt-3">
        <button type="submit" class="btn btn-primary"><i class="bi bi-save"></i> 保存</button>
        <a href="{{ url_for('students.group_list') }}" class="btn btn-link">取消</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
